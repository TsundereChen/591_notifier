<!DOCTYPE html>
<html lang="zh-TW">
<head><title>好宅租管【社宅可租補】捷運頂埔站步行6分鐘｜透天3層樓可寵 - 591租屋網</title></head>
<body>
<div id="__nuxt">
<section class="main">

  <!-- photo album: one lazy image, one direct -->
  <section class="album">
    <ul data-gtm-behavior="album" data-count="more">
      <li class="album-pc-item"><img src="data:image/svg+xml,%3c?xml%20version='1.0'%3e%3csvg/%3e" data-src="https://img2.591.com.tw/house/2026/08/10/178634320525224801.jpg!1000x.water2.jpg" alt="照片"></li>
      <li class="album-pc-item"><img src="https://img1.591.com.tw/house/2026/08/10/178634320492218005.jpg!1000x.water2.jpg" data-src="https://img1.591.com.tw/house/2026/08/10/178634320492218005.jpg!1000x.water2.jpg" alt="照片"></li>
    </ul>
  </section>

  <section class="main-wrapper">
    <section class="main-content">

      <!-- main info board -->
      <section class="block info-board">
        <div class="title"><span class="preferred-tag">優選好屋</span><h1>好宅租管【社宅可租補】捷運頂埔站步行6分鐘｜透天3層樓可寵</h1></div>
        <div class="house-label">
          <span class="active label-item">近捷運</span><span class="active label-item">新上架</span><span class="label-item">免服務費</span><span class="label-item">可養寵物</span>
        </div>
        <div class="pattern">
          <span>4房2廳2衛</span><span class="line"></span>
          <span class="inline-flex-row">43坪 <span class="ic-house house-tips icon-tip"></span></span><span class="line"></span>
          <span class="inline-flex-row">3F/3F </span><span class="line"></span>
          <span>公寓</span>
        </div>
        <div class="house-price">
          <span class="c-price"><strong class="inline-flex-row">16,000</strong> 元/月</span> 二個月
          <div class="extra-fee"><span class="extra-fee-text">租金不含其他費用</span><span class="rent-calculation">總支出試算</span></div>
        </div>
      </section>

      <!-- address -->
      <section class="block surround">
        <h2 class="block-title">位置與周邊</h2>
        <div class="address"><p><span>地<em class="space"></em>址:</span><span data-gtm-behavior="address" class="load-map"><div class="inline-flex-row">土城區中央路四段125巷</div></span></p></div>
      </section>

      <!-- rental notes + facilities -->
      <section class="block service">
        <h2 class="block-title">租住與設備</h2>
        <div class="item-row">
          <div class="row-content">
            <p class="row-title">租住說明</p>
            <div class="desc-list">
              <div class="desc-item"><span class="desc-label">最短租期</span><span class="desc-value">一年</span></div>
              <div class="desc-item"><span class="desc-label">養寵物</span><span class="desc-value">可養寵物</span></div>
              <div class="desc-item"><span class="desc-label">開伙</span><span class="desc-value">可開伙</span></div>
            </div>
          </div>
        </div>
        <div class="facility">
          <dl class=""><dt><i class="ic-house house-fridge-big"></i></dt><dd class="text">冰箱</dd></dl>
          <dl class=""><dt><i class="ic-house house-washer"></i></dt><dd class="text">洗衣機</dd></dl>
          <dl class="del"><dt><i class="ic-house house-wifi-big"></i></dt><dd class="text">網路</dd></dl>
          <dl class="del"><dt><i class="ic-house house-gas"></i></dt><dd class="text">天然瓦斯</dd></dl>
        </div>
      </section>

      <!-- description + poster -->
      <section class="block">
        <h2 class="block-title">屋況介紹</h2>
        <div class="house-condition-header">
          <section class="contact">
            <div class="contact-info">
              <p class="base-info-pc"><span class="name">仲介: 林小姐</span></p>
              <div class="company-info"><p>經紀業: 禾豐好宅管理顧問股份有限公司</p></div>
            </div>
          </section>
        </div>
        <div class="house-condition-content">
          <div class="article t5-rich-editor">
            <p dir="auto"><span>第一行說明<br>第二行說明</span></p>
            <p dir="auto"><span>注意事項</span></p>
          </div>
        </div>
      </section>

      <!-- detail sections -->
      <section class="block">
        <h2 class="block-title">房屋詳情</h2>
        <div class="house-detail-content">
          <section class="detail-section">
            <div class="section-title"><span class="section-icon icon-record"></span><span class="section-name">基礎資料</span></div>
            <div class="section-content">
              <div class="row">
                <div class="item"><span class="label">電梯</span><span class="value"><span>無</span></span></div>
                <div class="item"><span class="label">陽台</span><span class="value"><span>2陽台</span></span></div>
              </div>
            </div>
          </section>
          <section class="detail-section">
            <div class="section-title"><span class="section-icon icon-price"></span><span class="section-name">房屋價格</span></div>
            <div class="section-content">
              <div class="row">
                <div class="item"><span class="label">租金</span><span class="value"><span>16,000元/月</span></span></div>
                <div class="item"><span class="label">押金</span><span class="value"><span>二個月</span></span></div>
              </div>
              <div class="row">
                <div class="item"><span class="label">管理費</span><span class="value"><span>無</span></span></div>
              </div>
            </div>
          </section>
        </div>
      </section>

    </section>
  </section>
</section>
</div>
</body>
</html>
